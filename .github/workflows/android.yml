name: Compilar APK de Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Verificar archivos
        run: |
          ls -la
          test -f package.json
          test -f capacitor.config.json
          test -f scripts/build-www.mjs
          test -f scripts/patch-android.mjs

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Preparar proyecto Android
        run: |
          npm run build:www
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Compilar APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copiar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KartazoRally.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KartazoRally-apk
          path: KartazoRally.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ultima' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Ultima version' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: KartazoRally.apk
