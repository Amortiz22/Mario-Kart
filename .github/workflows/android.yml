      - uses: actions/setup-node@v5
        with: { node-version: 22 }

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }

      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Preparar proyecto Android
        run: |
          npm run build:www
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Compilar APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk KartazoRally.apk

      - uses: actions/upload-artifact@v4
        with: { name: KartazoRally-apk, path: KartazoRally.apk }

      - name: Publicar release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: KartazoRally.apk }
